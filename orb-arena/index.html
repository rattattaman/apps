<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b12" />
    <meta name="description" content="Orb Arena: simulador automático de combates entre orbes armados." />
    <title>Orb Arena</title>
    <script type="module" crossorigin src="/apps/orb-arena/assets/orb-arena-_Q1y_xJ5.js"></script>
    <link rel="stylesheet" crossorigin href="/apps/orb-arena/assets/orb-arena-DVeJjJu7.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Orb Arena, inicio">
          <span class="brand-mark" aria-hidden="true"></span>
          <span><strong>ORB</strong> ARENA</span>
        </a>
        <div class="battle-meta" aria-live="polite">
          <span class="live-dot"></span>
          <span id="battle-status">SALA DE PREPARACIÓN</span>
          <span class="seed-chip">SEMILLA <b id="seed-display">—</b></span>
        </div>
      </header>

      <main class="game-shell">
        <section class="scoreboard" id="scoreboard" aria-label="Estado de combatientes"></section>

        <section class="arena-frame" aria-label="Arena de combate">
          <div id="game-canvas"></div>
          <div class="arena-grid" aria-hidden="true"></div>
          <div id="event-feed" class="event-feed" aria-live="polite"></div>
          <div id="winner-panel" class="winner-panel hidden" role="dialog" aria-modal="true">
            <p class="eyebrow">ÚLTIMO ORBE EN PIE</p>
            <h2 id="winner-name">Victoria</h2>
            <p id="winner-detail"></p>
            <div class="winner-actions">
              <button id="replay-button" class="button button-primary">Repetir batalla</button>
              <button id="new-battle-button" class="button">Nueva batalla</button>
            </div>
          </div>
        </section>

        <section class="control-dock" aria-label="Controles de simulación">
          <div class="dock-group">
            <button id="pause-button" class="icon-button" aria-label="Pausar batalla" title="Pausar">Ⅱ</button>
            <button id="restart-button" class="icon-button" aria-label="Reiniciar batalla" title="Reiniciar">↻</button>
            <button id="setup-button" class="text-button">Nueva batalla</button>
          </div>
          <div class="speed-control" role="group" aria-label="Velocidad de simulación">
            <span>VELOCIDAD</span>
            <button data-speed="0.5">×0,5</button>
            <button data-speed="1" class="active">×1</button>
            <button data-speed="2">×2</button>
          </div>
          <div class="dock-group dock-end">
            <button id="particles-button" class="text-button" aria-pressed="true">✦ Partículas</button>
            <button id="mute-button" class="icon-button" aria-label="Silenciar" aria-pressed="false">♪</button>
          </div>
        </section>
      </main>

      <div id="transition-overlay" class="transition-overlay hidden" aria-live="polite" aria-busy="true">
        <span class="transition-orb" aria-hidden="true"></span>
        <b>PREPARANDO LA ARENA</b>
      </div>

      <div id="setup-overlay" class="setup-overlay">
        <form id="setup-form" class="setup-card">
          <div class="setup-heading">
            <div>
              <p class="eyebrow">CONFIGURAR ENFRENTAMIENTO</p>
              <h1>Prepara la arena</h1>
              <p>Elige a los combatientes. Cuando suene la campana, solo las físicas deciden.</p>
            </div>
            <div class="arena-emblem" aria-hidden="true"><span></span></div>
          </div>

          <div class="setup-grid">
            <label class="field">
              <span>Combatientes</span>
              <select id="fighter-count" name="fighterCount">
                <option value="2">2 orbes</option>
                <option value="3">3 orbes</option>
                <option value="4">4 orbes</option>
                <option value="5">5 orbes</option>
                <option value="6">6 orbes</option>
                <option value="7">7 orbes</option>
                <option value="8">8 orbes</option>
                <option value="9">9 orbes</option>
                <option value="10" selected>10 orbes</option>
              </select>
            </label>
            <label class="field">
              <span>Vida inicial <output id="health-output">100</output></span>
              <input id="starting-health" name="startingHealth" type="range" min="50" max="200" step="10" value="100" />
            </label>
            <label class="field field-seed">
              <span>Semilla</span>
              <span class="input-with-button">
                <input id="seed-input" name="seed" type="text" maxlength="24" autocomplete="off" />
                <button id="random-seed" type="button" aria-label="Generar semilla">↻</button>
              </span>
            </label>
            <label class="toggle-field">
              <input id="chaos-mode" name="chaosMode" type="checkbox" />
              <span class="toggle"></span>
              <span><b>Modo Caos</b><small>Ocho anomalías impredecibles</small></span>
            </label>
          </div>

          <fieldset class="roster-fieldset">
            <legend>Temporadas 1–2 · Arsenal</legend>
            <div id="roster-editor" class="roster-editor"></div>
          </fieldset>

          <div class="setup-footer">
            <p><span class="pulse-dot"></span> Simulación automática · <b id="career-stats">0 batallas guardadas</b></p>
            <button type="submit" class="button button-primary button-large">INICIAR BATALLA <span>→</span></button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
